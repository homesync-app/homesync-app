name: Supabase Keep-Alive

# El plan Free de Supabase pausa el proyecto tras 7 días sin actividad. Con
# pocos usuarios activos eso deja la app caída hasta que alguien lo restaura a
# mano. Esta consulta liviana cada 3 días mantiene el proyecto despierto.
#
# Nota: GitHub desactiva los workflows programados de repos públicos tras 60
# días sin commits. Si pasa, reactivarlo desde la pestaña Actions.

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets are required"
            exit 1
          fi

          headers=(-H "apikey: ${SUPABASE_ANON_KEY}")
          # Una anon key legacy (JWT) también va como Bearer; una publishable
          # key nueva (sb_publishable_...) va solo en apikey.
          if [[ "$SUPABASE_ANON_KEY" == eyJ* ]]; then
            headers+=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          fi

          # Consulta real contra Postgres: para anon RLS devuelve [], pero la
          # query corre igual y cuenta como actividad del proyecto.
          status=$(curl -sS --retry 3 --retry-delay 15 --retry-all-errors \
            -o response.json -w '%{http_code}' \
            "${headers[@]}" \
            "${SUPABASE_URL%/}/rest/v1/categories?select=id&limit=1")

          echo "HTTP ${status}"
          if [ "$status" != "200" ]; then
            cat response.json
            exit 1
          fi
          if ! head -c 1 response.json | grep -q '\['; then
            echo "Unexpected response body:"
            cat response.json
            exit 1
          fi
          echo "Supabase is awake."
