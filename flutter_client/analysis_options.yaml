include: package:flutter_lints/flutter.yaml

# Riverpod 3.x lint rules via the native analysis_server_plugin (no custom_lint
# runner needed). Surfaces Riverpod-specific issues directly in `flutter analyze`.
plugins:
  riverpod_lint: ^3.1.3

analyzer:
  exclude:
    # Third-party vendored UI components (Portal Labs, MIT). Kept as-is; not
    # subject to our lint rules.
    - lib/shared/widgets/portal_labs/**
  language:
    strict-casts: false
    strict-raw-types: false
  errors:
    avoid_print: error
    unused_import: error
    unnecessary_import: error

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_dynamic_calls: true
    require_trailing_commas: true
    directives_ordering: true
    prefer_single_quotes: true
