name: Deploy to Google Play

# Publicar a producción es manual: un push a main ya no dispara este
# workflow. Se corre sobre main desde Actions, o con gh, confirmando la
# versión de pubspec.yaml (sin el +build):
#   gh workflow run deploy-production.yml --ref main -f confirm_version=1.5.0
on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Versión a publicar, igual a pubspec.yaml sin el +build (ej. 1.5.0)"
        required: true
        type: string

# Nunca dos publicaciones a la vez.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-deploy-smoke:
    name: Pre-Deploy Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm release
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ Solo se publica desde main (este run es de $GITHUB_REF)."
            exit 1
          fi
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' flutter_client/pubspec.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "❌ No encontré 'version:' en flutter_client/pubspec.yaml."
            exit 1
          fi
          if [ "$CONFIRM_VERSION" != "$version" ]; then
            echo "❌ La confirmación ($CONFIRM_VERSION) no coincide con pubspec.yaml ($version)."
            exit 1
          fi
          echo "✅ Publicando $version desde main"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: SQL Quality Gate
        run: |
          python3 scripts/sql_quality_gate.py

      - name: CI Guard
        run: |
          python3 scripts/ci_guard.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Bloqueante: si la base de producción no pasa el smoke, no se publica.
      - name: Run production smoke checks
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "❌ Falta el secret PROD_DATABASE_URL: sin smoke no se publica."
            exit 1
          fi
          python3 scripts/prod_ops/run_post_deploy_smoke.py --db-url "$PROD_DATABASE_URL"

  build-and-deploy:
    name: Build and Deploy
    needs: pre-deploy-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fijado: misma versión que tests.yml, que el entorno local y que el
      # `--flutter-version` de shorebird release de abajo.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Get dependencies
        run: |
          cd flutter_client
          flutter pub get

      - name: Validate required secrets
        run: |
          missing=()
          [ -z "${{ secrets.SUPABASE_URL }}" ] && missing+=("SUPABASE_URL")
          [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ] && missing+=("SUPABASE_ANON_KEY")
          [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ] && missing+=("FIREBASE_PROJECT_ID")
          [ -z "${{ secrets.FIREBASE_API_KEY }}" ] && missing+=("FIREBASE_API_KEY")
          [ -z "${{ secrets.FIREBASE_APP_ID }}" ] && missing+=("FIREBASE_APP_ID")
          [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ] && missing+=("FIREBASE_MESSAGING_SENDER_ID")
          [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ] && missing+=("FIREBASE_AUTH_DOMAIN")
          [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ] && missing+=("FIREBASE_STORAGE_BUCKET")
          [ -z "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ] && missing+=("GOOGLE_WEB_CLIENT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "✅ All secrets present"
          if [ -z "${{ secrets.SHOREBIRD_TOKEN }}" ]; then
            echo "⚠️ SHOREBIRD_TOKEN not set — the release AAB will NOT be patchable via OTA."
            echo "   Create a CI token with 'shorebird login:ci' and add it as a repo secret."
          fi

      - name: Create production env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          cat > flutter_client/.env.production <<EOF
          APP_ENV=production
          AUTH_MODE=firebase_third_party
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          FIREBASE_API_KEY=${FIREBASE_API_KEY}
          FIREBASE_APP_ID=${FIREBASE_APP_ID}
          FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
          FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
          FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
          GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}
          EOF

      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_AVAILABLE=false" >> $GITHUB_ENV
            echo "⚠️ No keystore provided — skipping release signing"
          fi

      - name: Create key.properties
        if: env.KEYSTORE_AVAILABLE == 'true'
        run: |
          cat > flutter_client/android/key.properties <<EOF
          storeFile=../../../release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.STORE_PASSWORD }}
          EOF

      - name: Analyze code
        run: |
          cd flutter_client
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Set version code
        run: |
          # Offset keeps versionCode above the last manually-bumped value (53).
          # Formula: 100 + run_number guarantees it always exceeds 53 and auto-increments.
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Building with versionCode: $VERSION_CODE"

      - name: Build AAB (Shorebird release — patchable via OTA)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          cd flutter_client
          if [ "${{ env.KEYSTORE_AVAILABLE }}" != "true" ]; then
            echo "No keystore → building debug AAB (not deployable to Play, not patchable)"
            flutter build appbundle --debug \
              --dart-define-from-file=.env.production \
              --dart-define=APP_ENV=production \
              --build-number=${{ env.VERSION_CODE }}
          elif [ -z "$SHOREBIRD_TOKEN" ]; then
            # Hard guard: a plain `flutter build appbundle` produces an AAB WITHOUT
            # the Shorebird updater embedded, so it can NEVER receive OTA patches
            # (AGENTS.md "regla de oro"). We refuse to ship that silently.
            echo "❌ SHOREBIRD_TOKEN missing but a release build was requested."
            echo "   A non-Shorebird release AAB is permanently un-patchable."
            echo "   Add SHOREBIRD_TOKEN (shorebird login:ci) or build manually."
            exit 1
          else
            # `shorebird release android` wraps `flutter build appbundle --release`
            # and embeds the updater so the AAB stays OTA-patchable. Flutter args
            # are forwarded after `--`.
            #
            # Flutter fijado explícitamente (sin esto Shorebird usa su última
            # versión, que puede no ser la que se probó). Patches MUST be built
            # with the same Flutter version as the release; `shorebird patch`
            # la toma sola de la release. Subirla = release nueva, no patch.
            # --obfuscate hardens the Dart code in the AAB; --split-debug-info
            # saves the symbol map so Crashlytics stack traces stay readable.
            # The symbols dir is uploaded as an artifact below — keep it per release.
            shorebird release android \
              --flutter-version=3.47.5 \
              --no-confirm \
              -- \
              --dart-define-from-file=.env.production \
              --dart-define=APP_ENV=production \
              --build-number=${{ env.VERSION_CODE }} \
              --obfuscate \
              --split-debug-info=build/symbols
          fi

      - name: Upload AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homesync-appbundle-${{ github.sha }}
          path: flutter_client/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      # Obfuscation symbols — required to de-obfuscate Crashlytics stack traces.
      # Without these, release crash reports are unreadable. Keep per release.
      - name: Upload obfuscation symbols
        if: env.KEYSTORE_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homesync-symbols-${{ github.sha }}
          path: flutter_client/build/symbols
          if-no-files-found: warn

      # Las notas versionadas mandan. El texto generico solo cubre el caso en
      # que alguien olvide actualizarlas: una release que le saca funciones al
      # usuario no se puede anunciar como "correcciones de errores".
      - name: Create release notes
        if: env.KEYSTORE_AVAILABLE == 'true'
        run: |
          mkdir -p whatsnew/en-US whatsnew/es-AR
          SRC=flutter_client/playstore_assets/whatsnew

          for locale in en-US es-AR; do
            if [ -s "$SRC/$locale/whatsnew.txt" ]; then
              cp "$SRC/$locale/whatsnew.txt" "whatsnew/$locale/whatsnew.txt"
              echo "✅ $locale: notas versionadas"
            elif [ "$locale" = "es-AR" ]; then
              echo "⚠️ es-AR sin notas versionadas — usando texto generico"
              echo "Correcciones de errores, mejoras de rendimiento y mejoras de interfaz." \
                > "whatsnew/$locale/whatsnew.txt"
            else
              echo "⚠️ en-US sin notas versionadas — usando texto generico"
              echo "Bug fixes, performance improvements and UI enhancements." \
                > "whatsnew/$locale/whatsnew.txt"
            fi

            # Play rechaza la subida por encima de 500 caracteres.
            count=$(wc -m < "whatsnew/$locale/whatsnew.txt")
            if [ "$count" -gt 500 ]; then
              echo "❌ $locale: $count caracteres, el limite de Play es 500"
              exit 1
            fi
          done

      # Track production con status completed: la release queda enviada a
      # revisión de Google y se publica sola al aprobarse. Solo se llega acá
      # corriendo este workflow a mano, con la versión confirmada y el smoke
      # previo en verde.
      - name: Deploy to Google Play (Production)
        if: env.KEYSTORE_AVAILABLE == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.blas.homesync
          releaseFiles: flutter_client/build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: whatsnew
